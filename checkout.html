<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Tasty Bites</title>
     
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="https://i.ibb.co/NdqWKNHB/B29-E8821-B518-4391-AA75-56980-D4-BD2-D9.png">
</head>
<body>
         <!-- HEADER -->

    <header>

        <h1>🍽️ Tasty Bites Restaurant</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="menu.html">Menu</a>

            <a href="gallery.html">Gallery</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

        </nav>

    </header>

    <!-- CHECKOUT -->

    <main class="checkout-page">

        <h2>🛒 Checkout</h2>

        <p>Complete your details to place your order.</p>

        <!-- ORDER SUMMARY -->

        <section class="checkout-section">

            <h3>🍔 Your Order</h3>

            <div id="checkoutItems">

                <p>Loading your order...</p>

            </div>

            <div class="checkout-total">

                <h3>

                    Total:

                    <span id="checkoutTotal">

                        ₦0

                    </span>

                </h3>

            </div>

        </section>

        <!-- CUSTOMER DETAILS -->

        <section class="checkout-section">

            <h3>👤 Customer Details</h3>

            <form

                id="checkoutForm"

                action="https://formspree.io/f/mwvgjkdp"

                method="POST"

            >

                <!-- HIDDEN ORDER INFORMATION -->

                <input

                    type="hidden"

                    name="order"

                    id="orderDetails"

                >

                <input

                    type="hidden"

                    name="total"

                    id="orderTotal"

                >

                <input

                    type="hidden"

                    name="_subject"

                    value="🛒 New Tasty Bites Order"

                >

                <!-- FULL NAME -->

                <label for="customerName">

                    Full Name

                </label>

                <input

                    type="text"

                    id="customerName"

                    name="customerName"

                    placeholder="Enter your full name"

                    required

                >

                <!-- PHONE -->

                <label for="customerPhone">

                    Phone Number

                </label>

                <input

                    type="tel"

                    id="customerPhone"

                    name="customerPhone"

                    placeholder="08012345678"

                    required

                >

                <!-- EMAIL -->

                <label for="customerEmail">

                    Email Address

                </label>

                <input

                    type="email"

                    id="customerEmail"

                    name="customerEmail"

                    placeholder="you@example.com"

                    required

                >

                <!-- ADDRESS -->

                <label for="deliveryAddress">

                    Delivery Address

                </label>

                <textarea

                    id="deliveryAddress"

                    name="deliveryAddress"

                    placeholder="Enter your delivery address"

                    rows="4"

                    required

                ></textarea>

                <!-- ORDER NOTE -->

                <label for="orderNote">

                    Order Note (Optional)

                </label>

                <textarea

                    id="orderNote"

                    name="orderNote"

                    placeholder="Any special instruction?"

                    rows="3"

                ></textarea>

                <!-- PAYMENT BUTTON -->

                <button

                    type="submit"

                    id="payButton"

                    class="checkout-btn"

                >

                    💳 Pay Now with Paystack

                </button>

            </form>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>

        <p>

            © 2026 Tasty Bites Restaurant.

            All Rights Reserved.

        </p>

    </footer>

    <!-- PAYSTACK V2 -->

    <script src="https://js.paystack.co/v2/inline.js"></script>

    <!-- CHECKOUT JAVASCRIPT -->

    <script>

        document.addEventListener(

            "DOMContentLoaded",

            function () {

                // ==========================================

                // GET CART

                // ==========================================

                const cart =

                    JSON.parse(

                        localStorage.getItem(

                            "tastyBitesCart"

                        )

                    ) || [];

                // ==========================================

                // GET ELEMENTS

                // ==========================================

                const checkoutItems =

                    document.getElementById(

                        "checkoutItems"

                    );

                const checkoutTotal =

                    document.getElementById(

                        "checkoutTotal"

                    );

                const checkoutForm =

                    document.getElementById(

                        "checkoutForm"

                    );

                const payButton =

                    document.getElementById(

                        "payButton"

                    );

                // ==========================================

                // CHECK EMPTY CART

                // ==========================================

                if (cart.length === 0) {

                    checkoutItems.innerHTML = `

                        <p>

                            Your cart is empty.

                        </p>

                        <a href="menu.html">

                            🍔 Go Back to Menu

                        </a>

                    `;

                    checkoutTotal.textContent =

                        "₦0";

                    payButton.disabled = true;

                    return;

                }

                // ==========================================

                // CALCULATE TOTAL

                // ==========================================

                let total = 0;

                checkoutItems.innerHTML = "";

                // ==========================================

                // DISPLAY CART ITEMS

                // ==========================================

                cart.forEach(

                    function (item) {

                        const quantity =

                            item.quantity || 1;

                        const itemTotal =

                            item.price * quantity;

                        total += itemTotal;

                        const itemElement =

                            document.createElement(

                                "div"

                            );

                        itemElement.className =

                            "checkout-item";

                        itemElement.innerHTML = `

                            <div>

                                <strong>

                                    ${item.name}

                                </strong>

                                <p>

                                    Quantity:

                                    ${quantity}

                                </p>

                            </div>

                            <strong>

                                ₦${itemTotal.toLocaleString()}

                            </strong>

                        `;

                        checkoutItems.appendChild(

                            itemElement

                        );

                    }

                );

                // ==========================================

                // DISPLAY TOTAL

                // ==========================================

                checkoutTotal.textContent =

                    `₦${total.toLocaleString()}`;

                // ==========================================

                // PAYMENT

                // ==========================================

                checkoutForm.addEventListener(

                    "submit",

                    async function (event) {

                        // Stop normal form submission

                        event.preventDefault();

                        // ==================================

                        // GET CUSTOMER INFORMATION

                        // ==================================

                        const customerName =

                            document.getElementById(

                                "customerName"

                            ).value.trim();

                        const customerPhone =

                            document.getElementById(

                                "customerPhone"

                            ).value.trim();

                        const customerEmail =

                            document.getElementById(

                                "customerEmail"

                            ).value.trim();

                        // ==================================

                        // CHECK EMAIL

                        // ==================================

                        if (!customerEmail) {

                            alert(

                                "❌ Please enter your email address."

                            );

                            return;

                        }

                        // ==================================

                        // CREATE ORDER DETAILS

                        // ==================================

                        let orderDetails = "";

                        cart.forEach(

                            function (item) {

                                const quantity =

                                    item.quantity || 1;

                                const itemTotal =

                                    item.price *

                                    quantity;

                                orderDetails +=

                                    `${item.name} x ${quantity} = ₦${itemTotal.toLocaleString()}\n`;

                            }

                        );

                        // ==================================

                        // SAVE ORDER DETAILS

                        // ==================================

                        document.getElementById(

                            "orderDetails"

                        ).value =

                            orderDetails;

                        document.getElementById(

                            "orderTotal"

                        ).value =

                            `₦${total.toLocaleString()}`;

                        // ==================================

                        // CONVERT NAIRA TO KOBO

                        // ==================================

                        const amountInKobo =

                            Math.round(total * 100);

                        // ==================================

                        // CHANGE BUTTON

                        // ==================================

                        payButton.disabled = true;

                        payButton.textContent =

                            "⏳ Opening Paystack...";

                        // ==================================

                        // CREATE PAYSTACK

                        // ==================================

                        try {

                            const paystack =

                                new PaystackPop();

                            // ==================================

                            // OPEN PAYSTACK CHECKOUT

                            // ==================================

                            await paystack.checkout({

                                key:

                                    "pk_test_82a4a1325a52f5cfab9e463e7a05a19ef95a2d05",

                                email:

                                    customerEmail,

                                amount:

                                    amountInKobo,

                                currency:

                                    "NGN",

                                // CUSTOMER INFORMATION

                                firstName:

                                    customerName,

                                phone:

                                    customerPhone,

                                // EXTRA INFORMATION

                                metadata: {

                                    custom_fields: [

                                        {

                                            display_name:

                                                "Customer Name",

                                            variable_name:

                                                "customer_name",

                                            value:

                                                customerName

                                        },

                                        {

                                            display_name:

                                                "Phone Number",

                                            variable_name:

                                                "phone_number",

                                            value:

                                                customerPhone

                                        }

                                    ]

                                },

                                // ==================================

                                // PAYMENT SUCCESS

                                // ==================================

                                onSuccess:

                                    async function (

                                        transaction

                                    ) {

                                        console.log(

                                            "Payment successful:",

                                            transaction

                                        );

                                        // Add payment reference

                                        document.getElementById(

                                            "orderDetails"

                                        ).value =

                                            orderDetails +

                                            `\nPayment Reference: ${transaction.reference}`;

                                        // ==================================

                                        // SEND ORDER TO FORMSPREE

                                        // ==================================

                                        const formData =

                                            new FormData(

                                                checkoutForm

                                            );

                                        try {

                                            const response =

                                                await fetch(

                                                    checkoutForm.action,

                                                    {

                                                        method:

                                                            "POST",

                                                        body:

                                                            formData,

                                                        headers: {

                                                            "Accept":

                                                                "application/json"

                                                        }

                                                    }

                                                );

                                            // ==================================

                                            // FORMSPREE SUCCESS

                                            // ==================================

                                            if (

                                                response.ok

                                            ) {

                                                // Clear cart

                                                localStorage.removeItem(

                                                    "tastyBitesCart"

                                                );

                                                // Go to thank-you page

                                                window.location.href =

                                                    "thankyou.html";

                                            }

                                            // ==================================

                                            // FORMSPREE FAILED

                                            // ==================================

                                            else {

                                                alert(

                                                    "⚠️ Payment was successful, but the order notification could not be sent.\n\nPayment Reference: " +

                                                    transaction.reference

                                                );

                                                payButton.disabled =

                                                    false;

                                                payButton.textContent =

                                                    "💳 Pay Now with Paystack";

                                            }

                                        }

                                        catch (error) {

                                            console.error(

                                                error

                                            );

                                            alert(

                                                "⚠️ Payment was successful, but there was a problem sending your order.\n\nPayment Reference: " +

                                                transaction.reference

                                            );

                                            payButton.disabled =

                                                false;

                                            payButton.textContent =

                                                "💳 Pay Now with Paystack";

                                        }

                                    },

                                // ==================================

                                // PAYMENT CANCELLED

                                // ==================================

                                onCancel:

                                    function () {

                                        alert(

                                            "❌ Payment was cancelled. Your order has not been submitted."

                                        );

                                        payButton.disabled =

                                            false;

                                        payButton.textContent =

                                            "💳 Pay Now with Paystack";

                                    },

                                // ==================================

                                // PAYSTACK ERROR

                                // ==================================

                                onError:

                                    function (error) {

                                        console.error(

                                            "Paystack Error:",

                                            error

                                        );

                                        alert(

                                            "❌ Paystack could not open the payment window.\n\nPlease check your internet connection and try again."

                                        );

                                        payButton.disabled =

                                            false;

                                        payButton.textContent =

                                            "💳 Pay Now with Paystack";

                                    }

                            });

                        }

                        catch (error) {

                            console.error(

                                "Payment Error:",

                                error

                            );

                            alert(

                                "❌ Something went wrong while opening Paystack.\n\nPlease try again."

                            );

                            payButton.disabled =

                                false;

                            payButton.textContent =

                                "💳 Pay Now with Paystack";

                        }

                    }

                );

            }

        );

    </script>

</body>

</html>
