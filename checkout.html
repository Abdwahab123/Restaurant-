<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Checkout - Tasty Bites</title>
     
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="https://i.ibb.co/NdqWKNHB/B29-E8821-B518-4391-AA75-56980-D4-BD2-D9.png">
</head>
<body>
      <!-- HEADER -->

    <header>

        <h1>🍽️ Tasty Bites Restaurant</h1>

        <nav>

            <a href="index.html">Home</a>

            <a href="menu.html">Menu</a>

            <a href="gallery.html">Gallery</a>

            <a href="about.html">About</a>

            <a href="contact.html">Contact</a>

        </nav>

    </header>

    <!-- CHECKOUT -->

    <main class="checkout-page">

        <h2>🛒 Checkout</h2>

        <p>Complete your details to place your order.</p>

        <!-- ORDER SUMMARY -->

        <section class="checkout-section">

            <h3>🍔 Your Order</h3>

            <div id="checkoutItems">

                <p>Loading your order...</p>

            </div>

            <div class="checkout-total">

                <h3>

                    Total:

                    <span id="checkoutTotal">₦0</span>

                </h3>

            </div>

        </section>

        <!-- CUSTOMER DETAILS -->

        <section class="checkout-section">

            <h3>👤 Customer Details</h3>

            <form

                id="checkoutForm"

                action="https://formspree.io/f/mwvgjkdp"

                method="POST"

            >

                <!-- Hidden order information -->

                <input

                    type="hidden"

                    name="order"

                    id="orderDetails"

                >

                <input

                    type="hidden"

                    name="total"

                    id="orderTotal"

                >

                <input

                    type="hidden"

                    name="_subject"

                    value="🛒 New Tasty Bites Order"

                >

                <!-- NAME -->

                <label for="customerName">

                    Full Name

                </label>

                <input

                    type="text"

                    id="customerName"

                    name="customerName"

                    placeholder="Enter your full name"

                    required

                >

                <!-- PHONE -->

                <label for="customerPhone">

                    Phone Number

                </label>

                <input

                    type="tel"

                    id="customerPhone"

                    name="customerPhone"

                    placeholder="08012345678"

                    required

                >

                <!-- ADDRESS -->

                <label for="deliveryAddress">

                    Delivery Address

                </label>

                <textarea

                    id="deliveryAddress"

                    name="deliveryAddress"

                    placeholder="Enter your delivery address"

                    rows="4"

                    required

                ></textarea>

                <!-- NOTE -->

                <label for="orderNote">

                    Order Note (Optional)

                </label>

                <textarea

                    id="orderNote"

                    name="orderNote"

                    placeholder="Any special instruction?"

                    rows="3"

                ></textarea>

                <!-- SUBMIT -->

                <button

                    type="submit"

                    class="checkout-btn"

                >

                    ✅ Place Order

                </button>

            </form>

        </section>

    </main>

    <!-- FOOTER -->

    <footer>

        <p>

            © 2026 Tasty Bites Restaurant. All Rights Reserved.

        </p>

    </footer>

    <!-- MAIN JAVASCRIPT -->

    <script src="/Restaurant-/css/javascript/java.js"></script>

    <!-- CHECKOUT JAVASCRIPT -->

    <script>

        document.addEventListener("DOMContentLoaded", function () {

            // Get cart

            const cart =

                JSON.parse(localStorage.getItem("tastyBitesCart")) || [];

            // Get elements

            const checkoutItems =

                document.getElementById("checkoutItems");

            const checkoutTotal =

                document.getElementById("checkoutTotal");

            const checkoutForm =

                document.getElementById("checkoutForm");

            // If cart is empty

            if (cart.length === 0) {

                checkoutItems.innerHTML = `

                    <p>Your cart is empty.</p>

                    <a href="menu.html">

                        🍔 Go Back to Menu

                    </a>

                `;

                checkoutTotal.textContent = "₦0";

                return;

            }

            // Calculate total

            let total = 0;

            checkoutItems.innerHTML = "";

            // Display cart items

            cart.forEach(function (item) {

                const quantity =

                    item.quantity || 1;

                const itemTotal =

                    item.price * quantity;

                total += itemTotal;

                const itemElement =

                    document.createElement("div");

                itemElement.className =

                    "checkout-item";

                itemElement.innerHTML = `

                    <div>

                        <strong>

                            ${item.name}

                        </strong>

                        <p>

                            Quantity: ${quantity}

                        </p>

                    </div>

                    <strong>

                        ₦${itemTotal.toLocaleString()}

                    </strong>

                `;

                checkoutItems.appendChild(itemElement);

            });

            // Display total

            checkoutTotal.textContent =

                `₦${total.toLocaleString()}`;

            // Handle Place Order

            checkoutForm.addEventListener(

                "submit",

                async function (event) {

                    // Stop normal form submission

                    event.preventDefault();

                    // Create order details

                    let orderDetails = "";

                    cart.forEach(function (item) {

                        const quantity =

                            item.quantity || 1;

                        const itemTotal =

                            item.price * quantity;

                        orderDetails +=

                            `${item.name} x ${quantity} = ₦${itemTotal.toLocaleString()}\n`;

                    });

                    // Put order information into hidden fields

                    document.getElementById(

                        "orderDetails"

                    ).value = orderDetails;

                    document.getElementById(

                        "orderTotal"

                    ).value =

                        `₦${total.toLocaleString()}`;

                    // Create Formspree data

                    const formData =

                        new FormData(checkoutForm);

                    try {

                        // Send to Formspree

                        const response =

                            await fetch(

                                checkoutForm.action,

                                {

                                    method: "POST",

                                    body: formData,

                                    headers: {

                                        "Accept":

                                            "application/json"

                                    }

                                }

                            );

                        // Successful

                        if (response.ok) {

                            // Clear cart

                            localStorage.removeItem(

                                "tastyBitesCart"

                            );

                            // Go to thank-you page

                            window.location.href =

                                "thankyou.html";

                        }

                        // Failed

                        else {

                            alert(

                                "❌ Your order could not be sent. Please try again."

                            );

                        }

                    }

                    // Internet/Formspree error

                    catch (error) {

                        alert(

                            "❌ There was a problem connecting to Formspree. Please check your internet connection."

                        );

                    }

                }

            );

        });

    </script>

</body>

</html>
